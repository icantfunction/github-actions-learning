# Display this label in the repository's Actions tab.
name: Node.js CI

# Define the GitHub events that start this workflow.
on:
  # Run CI whenever commits are pushed to the main branch.
  push:
    branches: [main] # Limit automatic push runs to the main branch.
  # Run CI when a pull request targets the main branch.
  pull_request:
    branches: [main] # Limit pull-request validation to changes proposed for main.
  # Allow a user to start a run from the Actions tab without making a commit.
  workflow_dispatch:

# Group the independent work performed by this workflow.
jobs:
  # Give the one CI job an internal identifier named test.
  test:
    # Define a matrix so this job runs once for each selected Node.js version.
    strategy:
      # Finish all matrix jobs even if one version fails, exposing all failures.
      fail-fast: false
      # Provide the list of Node.js major-release lines to test.
      matrix:
        node-version: [18.x, 20.x, 22.x] # Resolve each entry to its latest available patch release.
    # Use a fresh GitHub-hosted Linux virtual machine for each matrix job.
    runs-on: ubuntu-latest
    # Execute the following steps in order on that virtual machine.
    steps:
      # Download the exact repository revision that triggered this workflow.
      - name: Check out the repository
        uses: actions/checkout@v4 # Use the maintained checkout action, major version 4.

      # Install the Node.js version selected by this matrix job.
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4 # Use the maintained Node setup action, major version 4.
        with: # Supply configuration values to the setup action.
          node-version: ${{ matrix.node-version }} # Read this job's version from the matrix.
          cache: npm # Cache npm's downloaded packages to make later runs faster.

      # Print runtime versions and every project file so the job environment is visible.
      - name: Confirm Node.js and inspect project files
        run: | # Run this multi-line Bash script on the Linux runner.
          node --version # Confirm which resolved Node.js version is installed.
          npm --version # Confirm the npm version bundled with that Node.js release.
          find . -maxdepth 3 -type f | sort # List checked-out files, three directories deep, in stable order.

      # Install exactly the dependency versions recorded in package-lock.json.
      - name: Install dependencies
        run: npm ci # Use the reproducible CI install command rather than npm install.

      # Continue these checks after a failure so the same run reports lint, test, and build problems together.
      - name: Run linter
        id: lint # Name this result so the final step can evaluate its outcome.
        continue-on-error: true # Record a lint failure but continue to the remaining checks.
        run: npm run lint # Execute the lint script defined in package.json.

      # Run the automated tests and generate both terminal and LCOV coverage output.
      - name: Run tests with coverage
        id: test # Name this result so the final step can evaluate its outcome.
        continue-on-error: true # Record a test failure but continue to upload any available coverage.
        run: npm run test:coverage # Execute the coverage-enabled test script from package.json.

      # Preserve the coverage directory as a downloadable artifact for this run.
      - name: Upload coverage report
        if: always() # Attempt the upload even when an earlier lint or test step failed.
        uses: actions/upload-artifact@v4 # Use GitHub's maintained artifact-upload action, major version 4.
        with: # Supply configuration values to the artifact action.
          name: coverage-node-${{ matrix.node-version }} # Give each Node-version report a distinct artifact name.
          path: coverage/ # Upload the coverage directory generated by the test script.
          if-no-files-found: warn # Show a warning instead of hiding a missing coverage report.

      # Create the deployable output after quality checks have been attempted.
      - name: Build production bundle
        id: build # Name this result so the final step can evaluate its outcome.
        continue-on-error: true # Record a build failure but allow the final summary step to run.
        run: npm run build # Execute the production build script from package.json.

      # Convert any recorded quality-check failure into an overall failed job.
      - name: Mark the job failed if a quality check failed
        if: always() # Run this summary even if linting, tests, or the build failed.
        run: | # Run this multi-line Bash script on the Linux runner.
          echo "Lint: ${{ steps.lint.outcome }}" # Print the recorded lint outcome in the log.
          echo "Tests: ${{ steps.test.outcome }}" # Print the recorded test outcome in the log.
          echo "Build: ${{ steps.build.outcome }}" # Print the recorded build outcome in the log.
          if [[ "${{ steps.lint.outcome }}" != "success" || "${{ steps.test.outcome }}" != "success" || "${{ steps.build.outcome }}" != "success" ]]; then # Fail when any quality check did not succeed.
            exit 1 # Return a nonzero status so GitHub marks this job as failed.
          fi # End the conditional failure check.
